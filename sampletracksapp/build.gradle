plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id "io.sentry.android.gradle" version "5.8.0"
    id "com.autonomousapps.dependency-analysis"
}

repositories {
    google()
}

sentry {
    debug = true
    autoInstallation.enabled = false
}

android {
    namespace "com.example.sampletracksapp"

    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        applicationId "com.example.sampletracksapp"
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        buildConfigField "String", "SENTRY_TEST_PROJECT_DSN", project.properties.get("sentryTestProjectDSN")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        viewBinding = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName("debug")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        warningsAsErrors true
        lintConfig file("${project.rootDir}/config/lint/lint.xml")
        disable 'HardcodedText'
    }
}

dependencies {
    implementation project(":AutomatticTracks")
    implementation project(":crashlogging")
    implementation project(':experimentation')
    implementation "androidx.appcompat:appcompat:$androidxAppcompatVersion"
    implementation "com.google.android.material:material:$googleMaterialVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinxCoroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"

    // For performance showcase
    implementation "com.squareup.okhttp3:okhttp:$squareupOkhttpVersion"
}

dependencyAnalysis {
    issues {
        onUnusedDependencies {
            // This dependency is not needed but it is kept to preserve the module's default configuration.
            exclude(":AutomatticTracks")
        }
    }
}
